<div id="menu">
  <canvas id="hs-menu-bg" aria-hidden="true"></canvas>
  <div id="mb2">
    <div class="hs-header">
      <h1 class="hs-title" aria-label="NECRODICE">
        <svg viewBox="0 0 560 98" class="hs-wordmark-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Left & Right sculpted arch paths framing the central D20 "O" -->
            <path id="hsArcL" d="M 26 75 Q 138 58 244 58"/>
            <path id="hsArcLD1" d="M 26 78.5 Q 138 61.5 244 61.5"/>
            <path id="hsArcLD2" d="M 26 82 Q 138 65 244 65"/>
            <path id="hsArcR" d="M 316 58 Q 422 58 534 75"/>
            <path id="hsArcRD1" d="M 316 61.5 Q 422 61.5 534 78.5"/>
            <path id="hsArcRD2" d="M 316 65 Q 422 65 534 82"/>

            <!-- Hearthstone-inspired chiseled warm gold & bronze -->
            <linearGradient id="hsTavernGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff8d1"/>
              <stop offset="24%" stop-color="#f7cf63"/>
              <stop offset="56%" stop-color="#d48924"/>
              <stop offset="86%" stop-color="#8c4c0e"/>
              <stop offset="100%" stop-color="#572905"/>
            </linearGradient>
            <linearGradient id="hsBevelRim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff0b3"/>
              <stop offset="50%" stop-color="#ba7820"/>
              <stop offset="100%" stop-color="#381804"/>
            </linearGradient>

            <!-- Central glowing Crimson-Ember D20 ("O") -->
            <radialGradient id="hsDieAura" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ff6b78" stop-opacity="0.72"/>
              <stop offset="45%" stop-color="#cf2e3c" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="#cf2e3c" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="hsDieTop" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffb3ba"/>
              <stop offset="100%" stop-color="#df2c3b"/>
            </linearGradient>
            <linearGradient id="hsDieMid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f24957"/>
              <stop offset="100%" stop-color="#9e111d"/>
            </linearGradient>
            <linearGradient id="hsDieDark" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8f121d"/>
              <stop offset="100%" stop-color="#45040a"/>
            </linearGradient>
            <linearGradient id="hsFireSweep" x1="-0.3" y1="0" x2="0.1" y2="0.2">
              <stop offset="0%" stop-color="#fff8d6" stop-opacity="0"/>
              <stop offset="50%" stop-color="#fff8d6" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#fff8d6" stop-opacity="0"/>
              <animate attributeName="x1" values="-0.4;1.4;1.4" keyTimes="0;0.35;1" dur="6.5s" repeatCount="indefinite"/>
              <animate attributeName="x2" values="0;1.8;1.8" keyTimes="0;0.35;1" dur="6.5s" repeatCount="indefinite"/>
            </linearGradient>
          </defs>

          <!-- Warm crimson-gold glow behind central D20 -->
          <circle cx="280" cy="48" r="46" fill="url(#hsDieAura)"/>

          <!-- Left word half: NECR -->
          <text class="hs-wm-depth2"><textPath href="#hsArcLD2" startOffset="100%" text-anchor="end"><tspan class="hs-wm-cap">N</tspan>ECR</textPath></text>
          <text class="hs-wm-depth1"><textPath href="#hsArcLD1" startOffset="100%" text-anchor="end"><tspan class="hs-wm-cap">N</tspan>ECR</textPath></text>
          <text class="hs-wm-trim"><textPath href="#hsArcL" startOffset="100%" text-anchor="end"><tspan class="hs-wm-cap">N</tspan>ECR</textPath></text>
          <text class="hs-wm-face"><textPath href="#hsArcL" startOffset="100%" text-anchor="end"><tspan class="hs-wm-cap">N</tspan>ECR</textPath></text>
          <text class="hs-wm-sheen"><textPath href="#hsArcL" startOffset="100%" text-anchor="end"><tspan class="hs-wm-cap">N</tspan>ECR</textPath></text>

          <!-- Right word half: DICE -->
          <text class="hs-wm-depth2"><textPath href="#hsArcRD2" startOffset="0%" text-anchor="start">DIC<tspan class="hs-wm-cap">E</tspan></textPath></text>
          <text class="hs-wm-depth1"><textPath href="#hsArcRD1" startOffset="0%" text-anchor="start">DIC<tspan class="hs-wm-cap">E</tspan></textPath></text>
          <text class="hs-wm-trim"><textPath href="#hsArcR" startOffset="0%" text-anchor="start">DIC<tspan class="hs-wm-cap">E</tspan></textPath></text>
          <text class="hs-wm-face"><textPath href="#hsArcR" startOffset="0%" text-anchor="start">DIC<tspan class="hs-wm-cap">E</tspan></textPath></text>
          <text class="hs-wm-sheen"><textPath href="#hsArcR" startOffset="0%" text-anchor="start">DIC<tspan class="hs-wm-cap">E</tspan></textPath></text>

          <!-- Central D20 Necro-Die replacing "O" -->
            <polygon points="280,26 300,46 280,66 260,46" fill="url(#hsTavernGold)" />
        </svg>
      </h1>
    </div>
    <div class="hs-body">
      <div class="grp hs-plaque"><span>Yapay Zekaya Karşı</span><div class="row dr"><button class="d btn" data-d="easy">Kolay</button><button class="d btn" data-d="med">Orta</button><button class="d btn" data-d="hard">Zor</button><button class="d btn imp" data-d="imp">İmkansız</button></div></div>
      <div class="grp hs-plaque"><span>Çevrim İçi Düello</span><div class="row"><button id="b2" class="btn alt">Oda Oluştur</button></div><div class="row hs-join-row"><input id="code" placeholder="ODA KODU" maxlength="4"><button id="b3" class="btn alt">Odaya Katıl</button></div></div>
    </div>
    <div class="row mrow hs-drawer"><button id="b6" class="btn alt sm">Ayarlar</button><button id="b4" class="btn alt sm">Joker Kodeksi</button><button id="b5" class="btn alt sm">Nasıl Oynanır</button></div>
