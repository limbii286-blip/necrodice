        <svg viewBox="0 0 540 94" class="hs-wordmark-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <path id="hsArc" d="M 32 72 Q 270 46 508 72"/>
            <path id="hsArcD1" d="M 32 75.5 Q 270 49.5 508 75.5"/>
            <path id="hsArcD2" d="M 32 79 Q 270 53 508 79"/>
            <linearGradient id="hsTavernGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fffce6"/>
              <stop offset="22%" stop-color="#fde38e"/>
              <stop offset="52%" stop-color="#de9b32"/>
              <stop offset="82%" stop-color="#9e5912"/>
              <stop offset="100%" stop-color="#5e2d06"/>
            </linearGradient>
            <linearGradient id="hsBevelRim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff4c2"/>
              <stop offset="45%" stop-color="#c48224"/>
              <stop offset="100%" stop-color="#3a1a05"/>
            </linearGradient>
            <linearGradient id="hsFireSweep" x1="-0.3" y1="0" x2="0.1" y2="0.2">
              <stop offset="0%" stop-color="#fff8d6" stop-opacity="0"/>
              <stop offset="50%" stop-color="#fff8d6" stop-opacity="0.42"/>
              <stop offset="100%" stop-color="#fff8d6" stop-opacity="0"/>
              <animate attributeName="x1" values="-0.4;1.4;1.4" keyTimes="0;0.35;1" dur="6.5s" repeatCount="indefinite"/>
              <animate attributeName="x2" values="0;1.8;1.8" keyTimes="0;0.35;1" dur="6.5s" repeatCount="indefinite"/>
            </linearGradient>
          </defs>

          <text class="hs-wm-depth2"><textPath href="#hsArcD2" startOffset="50%" text-anchor="middle"><tspan class="hs-wm-cap">N</tspan>ECRODIC<tspan class="hs-wm-cap">E</tspan></textPath></text>
          <text class="hs-wm-depth1"><textPath href="#hsArcD1" startOffset="50%" text-anchor="middle"><tspan class="hs-wm-cap">N</tspan>ECRODIC<tspan class="hs-wm-cap">E</tspan></textPath></text>
          <!-- Burnished gold outer bevel -->
          <text class="hs-wm-trim"><textPath href="#hsArc" startOffset="50%" text-anchor="middle"><tspan class="hs-wm-cap">N</tspan>ECRODIC<tspan class="hs-wm-cap">E</tspan></textPath></text>

          <text class="hs-wm-face"><textPath href="#hsArc" startOffset="50%" text-anchor="middle"><tspan class="hs-wm-cap">N</tspan>ECRODIC<tspan class="hs-wm-cap">E</tspan></textPath></text>

          <text class="hs-wm-sheen"><textPath href="#hsArc" startOffset="50%" text-anchor="middle"><tspan class="hs-wm-cap">N</tspan>ECRODIC<tspan class="hs-wm-cap">E</tspan></textPath></text>
